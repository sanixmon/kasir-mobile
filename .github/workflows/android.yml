name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: CI Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        env:
          KASIR_SIGNING_PASSWORD: ${{ secrets.KASIR_SIGNING_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK
        env:
          KASIR_SIGNING_PASSWORD: ${{ secrets.KASIR_SIGNING_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Package Release Assets
        id: package
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION:-1.0.0}-${GITHUB_RUN_NUMBER}"
          mkdir -p release-assets

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "release-assets/kasir-mobile-${TAG}.apk"
            cp "$RELEASE_APK" "release-assets/app-release.apk"
          fi

          cd release-assets
          sha256sum *.apk > checksums.txt 2>/dev/null || true
          cd ..

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload CI APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kasir-mobile-ci-build
          path: release-assets/*
          retention-days: 14
